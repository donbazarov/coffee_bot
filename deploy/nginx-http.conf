# =============================================================================
#  НЕФТЬ · Coffee Bot — nginx, этап 1 (только HTTP, до сертификата)
#
#  Зачем отдельный файл: nginx не запустится, если в конфиге есть
#  ssl_certificate, указывающий на ещё не выпущенный сертификат —
#  `nginx -t` упадёт с "cannot load certificate".
#
#  Порядок:
#      1) поставить ЭТОТ конфиг;
#      2) выпустить сертификат:  sudo certbot certonly --webroot -w /var/www/html -d neftcoffee.shop
#      3) заменить конфиг на итоговый:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/coffee-bot
#      4) sudo nginx -t && sudo systemctl reload nginx
#
#  Установка этапа 1:
#      sudo mkdir -p /var/www/html
#      sudo cp deploy/nginx-http.conf /etc/nginx/sites-available/coffee-bot
#      sudo ln -sf /etc/nginx/sites-available/coffee-bot /etc/nginx/sites-enabled/coffee-bot
#      sudo rm -f /etc/nginx/sites-enabled/default
#      sudo nginx -t && sudo systemctl reload nginx
#
#  На этом этапе НЕТ редиректа на HTTPS — иначе certbot не сможет пройти
#  проверку домена по HTTP.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name neftcoffee.shop;

    # Путь для проверки домена Let's Encrypt — должен быть доступен по HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Фото историй уходят как base64 внутри JSON: 5 МБ превращаются в ~6.7 МБ
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/coffee-bot.access.log;
    error_log  /var/log/nginx/coffee-bot.error.log;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /stories/uploads/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }
}
