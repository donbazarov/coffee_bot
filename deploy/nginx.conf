# =============================================================================
#  НЕФТЬ · Coffee Bot — nginx, итоговый конфиг (HTTPS)
#
#  Домен: neftcoffee.shop
#
#  ⚠️  Ставится ПОСЛЕ выпуска сертификата. На первом запуске используйте
#      deploy/nginx-http.conf: nginx не стартует, если ssl_certificate
#      указывает на ещё не выпущенный файл.
#
#  Установка:
#      sudo cp deploy/nginx.conf /etc/nginx/sites-available/coffee-bot
#      sudo ln -sf /etc/nginx/sites-available/coffee-bot /etc/nginx/sites-enabled/coffee-bot
#      sudo rm -f /etc/nginx/sites-enabled/default
#      sudo nginx -t && sudo systemctl reload nginx
#
#  HTTP/2 включается прямо в listen — это работает и на nginx 1.18 из
#  Ubuntu 22.04, и на новых версиях. Отдельная директива `http2 on;`
#  появилась только в nginx 1.25.1 и на 1.18 падает с "unknown directive".
# =============================================================================

# --- HTTPS: основной сайт -----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name neftcoffee.shop;

    ssl_certificate     /etc/letsencrypt/live/neftcoffee.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neftcoffee.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Фото историй уходят как base64 внутри JSON: 5 МБ превращаются в ~6.7 МБ.
    client_max_body_size 8m;

    # Сжатие текстовых ответов
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/coffee-bot.access.log;
    error_log  /var/log/nginx/coffee-bot.error.log;

    location / {
        proxy_pass http://127.0.0.1:8001;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Загруженные фото историй отдаются напрямую и кешируются браузером.
    location /stories/uploads/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }
}

# --- HTTP: только редирект на HTTPS ------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name neftcoffee.shop;

    # Оставляем открытым, чтобы `certbot renew` проходил без правок конфига.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
